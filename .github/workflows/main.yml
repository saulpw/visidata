name: visidata-ci-build
on:
  pull_request:
    branches:
      - stable
      - develop
  push:
    branches:
    - stable
    - develop

jobs:
  full-tests:

    strategy:
      matrix:
        python-version: ["3.9", "3.14"]

    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install VisiData with test dependencies
      run: |
        pip3 install .
        pip3 install ".[test]"
        pip3 install pytest

    - name: Run tests
      run: dev/test-all.sh

  unit-tests:

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install VisiData with test dependencies
      run: |
        pip3 install .
        pip3 install ".[test]"
        pip3 install pytest

    - name: Run unit tests
      run: tests/test-pytest.sh
